<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Report Entry — v17</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
:root{--p:#5b4fe9;--pd:#4338ca;--ps:#eef0ff;--ink:#0f172a;--mut:#64748b;--bd:#e2e8f0;--bg:#f4f6fb;--ok:#16a34a;--warn:#f59e0b;--bad:#dc2626}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:#1e293b;font:14px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;cursor:pointer}
#app{display:flex;flex-direction:column;height:100vh}

/* ---------- top bar ---------- */
.top{background:#fff;border-bottom:1px solid var(--bd);padding:10px 18px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.pt-strip{display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:var(--ps);color:var(--pd);font-weight:800;display:flex;align-items:center;justify-content:center}
.pn{font-size:1.05rem;font-weight:800;color:var(--ink)}
.tag{font-size:.75rem;font-weight:700;background:#f1f5f9;color:#475569;border-radius:10px;padding:2px 9px;margin-left:6px;vertical-align:2px}
.pm{color:var(--mut);font-size:.82rem;display:flex;gap:14px;flex-wrap:wrap}
.pm i{color:var(--p);margin-right:4px}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.cg-x{display:flex;align-items:center;gap:8px}
.cl{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mut)}
.seg{display:inline-flex;background:#f1f5f9;border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:7px;font-weight:700;font-size:.82rem;color:#475569}
.seg button.on{background:#fff;color:var(--pd);box-shadow:0 1px 3px rgba(15,23,42,.18)}
.btn-x{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:8px;padding:6px 12px;font-weight:700;font-size:.84rem}
.btn-x:hover{border-color:var(--p);color:var(--pd)}
.btn-x.pri{background:var(--p);border-color:var(--p);color:#fff}
.btn-x.pri:hover{background:var(--pd)}
.btn-x.ok{border-color:#86efac;color:#15803d;background:#f0fdf4}
.btn-x.sm{padding:3px 10px;font-size:.78rem}
.cnt{background:#fff;color:var(--pd);border-radius:10px;padding:0 7px;margin-left:4px;font-size:.75rem}
#btnSide{display:none}

/* ---------- shell ---------- */
.shell{flex:1;display:flex;min-height:0;position:relative}
.side{width:272px;background:#fff;border-right:1px solid var(--bd);display:flex;flex-direction:column;flex:none}
.sb-top{padding:10px;border-bottom:1px solid var(--bd)}
.sb-top input[type=search]{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:6px 10px;font-size:.86rem}
.sb-top input:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px rgba(91,79,233,.15)}
.sb-flt{display:flex;gap:4px;margin-top:8px;align-items:center}
.sb-flt button{border:0;background:#f1f5f9;border-radius:6px;font-size:.74rem;font-weight:700;padding:3px 9px;color:#475569}
.sb-flt button.on{background:var(--p);color:#fff}
.sb-flt .sp{flex:1}
.sb-flt a{font-size:.74rem;font-weight:700;color:var(--pd);cursor:pointer;margin-left:6px}
#sbl{flex:1;overflow:auto;padding:6px 8px 20px}
.sb-cat{display:flex;justify-content:space-between;align-items:center;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:12px 6px 4px}
.sb-cat label{margin:0;display:flex;gap:7px;align-items:center;cursor:pointer}
.sb-i{display:grid;grid-template-columns:18px 1fr auto;gap:2px 8px;align-items:center;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.sb-i:hover{background:#f8fafc}
.sb-i.on{background:var(--ps);border-color:#d9d9ff}
.sb-n{font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-n small{color:var(--mut);font-weight:600;margin-left:4px}
.sb-s{font-size:.72rem;font-weight:700;color:var(--mut)}
.sb-p{grid-column:2/4;height:4px;background:#e2e8f0;border-radius:3px;overflow:hidden}
.sb-p i{display:block;height:100%;background:var(--warn);width:0}
.sb-i.done .sb-p i{background:var(--ok)}
.sb-i.dirty .sb-n:after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px}
.sb-none{padding:20px;text-align:center;color:var(--mut)}

.main{flex:1;overflow:auto;min-width:0;position:relative}
.sub{position:sticky;top:0;z-index:20;background:rgba(244,246,251,.96);backdrop-filter:blur(4px);border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.sub .l{display:flex;gap:6px;align-items:center;flex-wrap:wrap;flex:1}
.cur{font-weight:800;color:var(--ink);padding:0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid #cbd5e1;background:#fff;border-radius:20px;padding:2px 12px;font-size:.8rem;font-weight:700;color:#334155;cursor:pointer}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip small{opacity:.75;margin-left:4px}
.prog{display:flex;align-items:center;gap:8px;min-width:190px}
.prog .bar{flex:1;height:6px;background:#e2e8f0;border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .25s}
.prog small{font-weight:800;color:var(--mut)}
#body{padding:14px 20px 30px}

/* ---------- category & test cards ---------- */
.cat{--cc:var(--p);margin-bottom:22px;background:#e9edf6;border:1px solid #cfd6e6;border-top:4px solid var(--cc);border-radius:14px;padding:0 12px 2px;box-shadow:0 6px 18px rgba(15,23,42,.14)}
.cat-h{display:flex;align-items:center;justify-content:space-between;cursor:pointer;background:var(--cc);color:#fff;border-radius:9px;padding:8px 14px;margin:12px 0}
.cat-h .t{font-weight:800;font-size:1.05rem;color:#fff;letter-spacing:.3px;display:flex;align-items:center}
.cat-h .t i{color:#fff;margin-right:6px}.cat-h .fa-chevron-down{color:#fff!important}
.cat-h .t small{font-weight:700;color:#fff;opacity:.85;margin-left:8px;background:rgba(255,255,255,.2);border-radius:10px;padding:0 8px}
.sb-cat{border-left:4px solid var(--cc);margin-top:6px;background:#f8fafc;border-radius:0 6px 6px 0}
.single .cat-h .fa-chevron-down{display:none}
.cat.cc .cat-b{display:none}
.tc{background:#fff;border:1px solid var(--bd);border-left:4px solid var(--warn);border-radius:10px;margin-bottom:14px;box-shadow:0 1px 3px rgba(15,23,42,.05);overflow:hidden}
.tc.done{border-left-color:var(--ok)}
.th{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fafbfe;border-bottom:1px solid var(--bd);cursor:pointer}
.single .th{cursor:default}
.tt{font-size:1.02rem}.tt b{color:var(--ink)}.tt .mut{color:var(--mut);margin-left:6px;font-weight:600}
.th .sp{flex:1}
.sel{margin:0;display:flex;align-items:center;cursor:pointer}
.sel input,.sb-i input,.sb-cat input,.c-h input{accent-color:var(--p);width:16px;height:16px;cursor:pointer}
.pill{font-size:.72rem;font-weight:800;border-radius:12px;padding:2px 10px;background:#f1f5f9;color:#475569;white-space:nowrap}
.pill.abn{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa}
.pill.st.ok{background:#dcfce7;color:#15803d}.pill.st.wait{background:#fef3c7;color:#b45309}
.ib{border:1px solid #cbd5e1;background:#fff;border-radius:8px;width:32px;height:30px;color:var(--pd)}
.ib:hover{background:var(--ps);border-color:var(--p)}
.tc.collapsed .tb{display:none}
.tacts{display:flex;gap:6px;justify-content:flex-end;padding:8px 14px 0}
.tacts button{border:0;background:transparent;color:var(--mut);font-size:.76rem;font-weight:700}
.tacts button:hover{color:var(--pd)}
.wrap{overflow-x:auto}
table.ct{width:100%;table-layout:fixed;border-collapse:collapse;margin:0}
.ct th{font-size:.68rem;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);padding:7px 8px;border-bottom:2px solid var(--bd);text-align:left;background:#fff}
.ct td{padding:4px 8px;border-bottom:1px solid #eef2f7;vertical-align:middle}
.ct tbody tr:hover td{background:#fafaff}
.c-sl{width:4%;text-align:center;color:var(--mut)}.c-h{width:5%;text-align:center}.c-n{width:24%;font-weight:700;color:var(--ink)}
.c-r{width:24%}.c-u{width:10%}.c-ref{width:20%}.c-s{width:13%}
.f{width:100%;height:32px;padding:3px 9px;border:1.5px solid #d5dce6;border-radius:7px;background:#fff;color:var(--ink);font-size:.92rem;font-weight:600}
textarea.f{height:auto;padding:6px 9px}
.f:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px rgba(91,79,233,.16);background:#fffef5}
.f.bad{border-color:var(--bad);background:#fef2f2}
.f[data-f=result]{font-variant-numeric:tabular-nums;font-weight:700}
tr.abn .f[data-f=result]{color:#c2410c}
tr.crit .f[data-f=result]{color:var(--bad)}
tr.crit td{background:#fff5f5}
.f.fl{text-align:center;font-weight:700;font-size:.82rem}
.fl-High,.fl-Low,.fl-Abnormal{background:#fff7ed;color:#c2410c;border-color:#fdba74}
.fl-Critical{background:#fef2f2;color:var(--bad);border-color:#fca5a5}
.fl-Normal{background:#f0fdf4;color:#15803d;border-color:#bbf7d0}
.ref{display:inline-block;padding:2px 9px;background:var(--ps);border-left:3px solid var(--p);border-radius:5px;font-size:.84rem;font-weight:600;color:var(--pd)}
select.refsel{font-size:.84rem;color:var(--pd);background:var(--ps)}
.r-title td{background:#f1f5f9;font-weight:800;color:var(--ink);font-size:.86rem}
tr.hid td:not(.c-h):not(.c-sl){opacity:.38}tr.hid .c-n{text-decoration:line-through}
.cgp{display:flex;gap:6px}.cgp .f{flex:1;min-width:0;text-align:center}.cgp select{flex:0 0 80px}
.interp{font-weight:800}
.I_S{background:#dcfce7;color:#15803d}.I_I{background:#fef3c7;color:#b45309}.I_R{background:#fee2e2;color:#b91c1c}.I_NT{background:#eef2f6;color:#64748b}

/* comment + sign-off */
.sec{padding:12px 14px;border-top:1px solid var(--bd)}
.sec-t{display:flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--pd);margin-bottom:8px}
.sec-t small{text-transform:none;letter-spacing:0;font-weight:600;color:var(--mut)}
.sec-t .r{margin-left:auto;color:var(--mut);font-weight:700;text-transform:none;letter-spacing:0}
.phr{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.phr button{border:1px dashed #b9b4f7;background:#fafaff;color:var(--pd);border-radius:14px;padding:2px 10px;font-size:.76rem;font-weight:700}
.phr button:hover{background:var(--ps)}
.f-c{width:100%;min-height:74px;resize:vertical;border:1.5px solid #d5dce6;border-radius:8px;padding:8px 10px;font:500 .92rem/1.45 inherit;color:var(--ink)}
.f-c:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px rgba(91,79,233,.16)}
.so-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.so-grid label{font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--mut);margin:0 0 3px;display:block}
.so-grid label i{color:var(--p);margin-right:4px}
.so-grid select{width:100%;height:34px;border:1.5px solid #d5dce6;border-radius:8px;padding:2px 10px;font-weight:600;color:var(--ink);background:#fff}
.so-grid select:focus{outline:0;border-color:var(--p);box-shadow:0 0 0 3px rgba(91,79,233,.16)}
.so-lock{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:.82rem;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px;padding:7px 12px}
.so-lock i{color:var(--p)}.so-lock a{color:var(--pd);font-weight:700;cursor:pointer;margin-left:auto}
.done-row{display:flex;justify-content:flex-end;padding:10px 14px;border-top:1px solid var(--bd);background:#fafbfe}
.chk{display:inline-flex;align-items:center;gap:7px;margin:0;font-weight:700;color:var(--ink);cursor:pointer;background:#fff;border:1.5px solid #cbd5e1;border-radius:20px;padding:4px 14px}
.chk input{accent-color:var(--ok);width:16px;height:16px}
.chk:has(input:checked){border-color:#86efac;background:#f0fdf4;color:#15803d}
.catsign{background:linear-gradient(135deg,#f6f5ff,#eef0ff);border:1px solid #d6d4fb;border-radius:10px;padding:14px;margin-top:4px}
.catsign .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px}

.qd.on{background:#dcfce7;border-color:#86efac;color:#15803d}
.qd{white-space:nowrap}
.sb-cat a:hover{color:var(--p)}
.tc:focus-within{box-shadow:0 0 0 2px rgba(91,79,233,.25)}
.sg-row{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}.sg-main{flex:1;min-width:300px}.sg-row .chk{margin-bottom:1px}.f-c{min-height:54px}
.pv-q{background:#f8fafc;border-bottom:1px solid var(--bd);padding:7px 16px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pq{border:1.5px solid #cbd5e1;background:#fff;border-radius:16px;padding:2px 11px;font-size:.78rem;font-weight:700;color:#334155}
.pq.on{background:var(--p);border-color:var(--p);color:#fff}.pq.part{border-color:var(--p);color:var(--pd);background:var(--ps)}.pq.cat{border-radius:6px}
.pqs{width:1px;height:20px;background:#cbd5e1;margin:0 4px}
.blank .pr td{height:8mm}
/* ---------- save bar ---------- */
.savebar{background:#fff;border-top:1px solid var(--bd);padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.savebar .hint{margin-left:auto;color:var(--mut);font-size:.76rem}
.dirty{display:none;color:#b45309;font-weight:800;font-size:.82rem}.dirty.show{display:inline}
.opt{margin:0;font-size:.8rem;font-weight:700;color:#475569;display:flex;gap:5px;align-items:center;cursor:pointer}
.opt input{accent-color:var(--p)}
kbd{background:#f1f5f9;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:4px;padding:0 5px;font-size:.72rem;color:#334155}

/* ---------- toast ---------- */
#toasts{position:fixed;right:18px;bottom:70px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast-x{min-width:220px;max-width:360px;padding:10px 16px;border-radius:9px;color:#fff;font-weight:600;box-shadow:0 8px 22px rgba(0,0,0,.22);animation:tin .22s}
.toast-x.ok{background:var(--ok)}.toast-x.err{background:var(--bad)}.toast-x.info{background:var(--p)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- print preview ---------- */
#pv{display:none;position:fixed;inset:0;z-index:1000;background:#475569;flex-direction:column}
#pv.show{display:flex}
.pv-bar{background:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border-bottom:1px solid var(--bd)}
.pv-bar b{color:var(--ink)}
.pv-bar select{border:1px solid #cbd5e1;border-radius:8px;padding:5px 10px;font-weight:700;font-size:.86rem}
.pv-bar .sp{flex:1}
.pv-body{flex:1;overflow:auto;padding:22px 10px}
.pv-empty{background:#fff;border-radius:10px;padding:40px;text-align:center;max-width:520px;margin:40px auto;color:var(--mut)}
.sheet{background:#fff;width:210mm;min-height:297mm;margin:0 auto 22px;padding:14mm 14mm 12mm;box-shadow:0 8px 30px rgba(0,0,0,.35);color:#111;font-size:12px;position:relative}
.lh{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2.5px solid #1e293b;padding-bottom:8px}
.lh-n{font-size:20px;font-weight:800;color:#1e293b}.lh-a{color:#475569;font-size:11px}
.lh-r{text-align:right;font-size:11px;color:#475569}.lh-r b{color:#1e293b;font-size:13px;letter-spacing:1px}
.pi{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 14px;border:1px solid #cbd5e1;border-radius:4px;padding:8px 10px;margin:10px 0 12px;font-size:11.5px}
.pi span{color:#64748b}.pi b{color:#0f172a}
.cat-band{background:#1e293b;color:#fff;text-align:center;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;font-size:11.5px;padding:4px;margin:12px 0 8px}
.pt-t{margin-bottom:12px;break-inside:avoid}
.pt-t h4{font-size:13px;font-weight:800;margin:0 0 4px;color:#0f172a;border-bottom:1px solid #94a3b8;padding-bottom:2px}
table.pr{width:100%;border-collapse:collapse;font-size:12px}
.pr th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#475569;border-bottom:1px solid #94a3b8;padding:3px 6px}
.pr td{padding:3px 6px;border-bottom:1px dotted #cbd5e1}
.pr .st td{font-weight:800;background:#f1f5f9;border-bottom:1px solid #cbd5e1}
.pr .rs{font-weight:700}.pr .ab{font-weight:900}.pr .fg{text-align:center;font-weight:800;width:70px}
.cm{margin-top:6px;padding:6px 8px;background:#f8fafc;border-left:3px solid #64748b;font-size:11.5px;white-space:pre-wrap}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:34px;text-align:center;break-inside:avoid}
.sg .sl{border-top:1px solid #334155;padding-top:3px;font-weight:700;min-height:18px}
.sg .sr{color:#64748b;font-size:10.5px}
.pf{margin-top:18px;text-align:center;font-size:10px;color:#94a3b8;border-top:1px solid #e2e8f0;padding-top:5px}

@media(max-width:900px){
 #btnSide{display:inline-block}
 .side{position:absolute;z-index:40;top:0;bottom:0;left:0;transform:translateX(-102%);transition:transform .2s;box-shadow:6px 0 24px rgba(0,0,0,.18)}
 .side.open{transform:none}
 .so-grid{grid-template-columns:1fr}
 table.ct{min-width:640px}
 .sheet{width:100%;min-height:0;padding:10mm}
}
@media print{
 @page{size:A4;margin:10mm 10mm 14mm;@bottom-right{content:"Page " counter(page) " / " counter(pages);font:9px sans-serif;color:#64748b}}
 html,body{height:auto;background:#fff}
 #app,#toasts{display:none!important}
 #pv,#pv.show{display:block!important;position:static!important;background:#fff!important}
 .pv-bar,.pv-q{display:none!important}
 .pv-body{padding:0!important;overflow:visible!important}
 .sheet{box-shadow:none!important;margin:0!important;width:auto!important;min-height:0!important;padding:0!important;page-break-after:always}
 .sheet:last-child{page-break-after:auto}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* ---------- v7 polish ---------- */
.pt-strip{gap:14px}
.pn,.pm{font-size:1.05rem;font-weight:800;color:var(--ink)}
.pm{gap:4px 18px;margin-top:2px}
.tag{font-size:inherit;font-weight:800;color:var(--ink);padding:1px 10px}
.top{box-shadow:0 1px 3px rgba(15,23,42,.06)}
.sb-sel{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--mut)}
.sb-sel span{flex:1}.sb-sel a{cursor:pointer;color:var(--pd);text-transform:none;font-size:.8rem;letter-spacing:0}
.sb-hid{font-size:.7rem;color:var(--mut);padding:2px 10px 6px;font-style:italic}
.cat{background:transparent;border:0;padding:0;box-shadow:none;margin-bottom:20px}
.cat-h{margin:0 0 10px;padding:9px 14px;box-shadow:0 2px 6px rgba(15,23,42,.12)}
.tc{border:1px solid var(--bd);border-left:4px solid var(--warn);border-radius:12px;box-shadow:0 2px 8px rgba(15,23,42,.07)}
.th{background:linear-gradient(#fff,#f6f8fc)}
.ct tbody tr:nth-child(even) td{background:#fbfcfe}
.f{height:34px}.f[data-f=result]{font-size:1rem}
.tfoot{display:block;border-top:1px solid var(--bd)}
.tfoot>.sec{border-top:0}.tfoot>.sec+.sec{border-top:1px solid var(--bd);background:#fafbfe}
.tfoot .sg-main{min-width:0;flex:1}.tfoot .sg-row{align-items:center}
.sg-sum{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-weight:700;color:var(--ink);font-size:.86rem}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function opt(list,sel){return list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')}
function T(id){return TESTS.filter(function(t){return t.id===id})[0]}
function C(t,id){return t.comps.filter(function(c){return c.id===id})[0]}
function cats(){var o=[];TESTS.forEach(function(t){if(o.indexOf(t.cat)<0)o.push(t.cat)});return o}
function inCat(c){return TESTS.filter(function(t){return t.cat===c})}
function isMobile(){return window.innerWidth<=900}

/* ============================== state ============================ */
var CATC=['#1f5fbf','#0f8b8d','#b4572a','#7a4fb5','#2f855a','#b83250'];
function cc(c){return CATC[cats().indexOf(c)%CATC.length]}
var S={mode:'single',cur:1,cat:'__all__',sign:'test',filter:'all',q:'',collapsed:{},cc:{}};
var SIGN={};      /* category → {p,r,a}  (used when S.sign==='cat') */
var PV={one:null};

/* ---- auto flag from reference range ---- */
function parseRef(r){
 if(!r)return null; var m=String(r).match(/(-?\d+\.?\d*)\s*[–—-]\s*(-?\d+\.?\d*)/);
 if(m)return {lo:+m[1],hi:+m[2]};
 m=String(r).match(/<\s*(=)?\s*(-?\d+\.?\d*)/); if(m)return {hi:+m[2],strict:!m[1]};
 m=String(r).match(/>\s*(=)?\s*(-?\d+\.?\d*)/); if(m)return {lo:+m[2],strictLo:!m[1]};
 return null;
}
function autoFlag(c){
 if(c.type!=='number'||c.result==null||String(c.result).trim()==='')return '';
 var v=parseFloat(String(c.result).replace(/[<>]/g,'')); if(isNaN(v))return '';
 var r=parseRef(c.ref); if(!r)return '';
 if(r.lo!=null&&(r.strictLo?v<=r.lo:v<r.lo))return 'Low';
 if(r.hi!=null&&(r.strict?v>=r.hi:v>r.hi))return 'High';
 return 'Normal';
}
function badNum(c){return c.type==='number'&&c.result!=null&&String(c.result).trim()!==''&&!/^[<>]?\s*-?\d+(\.\d+)?$/.test(String(c.result).trim())}
function isAbn(c){return /^(High|Low|Abnormal|Critical)$/.test(c.status||'')}
function hasVal(c){return c.type==='culture'?!!(c.mic||c.zone||c.interp):(c.result!=null&&String(c.result).trim()!=='')}
function stats(t){var tot=0,f=0,a=0;t.comps.forEach(function(c){if(c.type==='title'||c.hide)return;tot++;if(hasVal(c))f++;if(isAbn(c))a++});return {tot:tot,f:f,a:a}}
function sg(t){if(S.sign==='cat'){var s=SIGN[t.cat]||{};return {p:s.p||'',r:s.r||'',a:s.a||''}}return {p:t.sp,r:t.sr,a:t.sa}}

/* init model */
TESTS.forEach(function(t){
 t.sel=false;t.dirty=false;t.comment=t.comment||'';t.sp=t.sp||DEF_SIGN.p;t.sr=t.sr||DEF_SIGN.r;t.sa=t.sa||DEF_SIGN.a;
 t.comps.forEach(function(c){if(c.type==='number'&&!c.status)c.status=autoFlag(c)});
});
cats().forEach(function(c){SIGN[c]={p:DEF_SIGN.p,r:DEF_SIGN.r,a:DEF_SIGN.a}});

/* ============================ rendering ========================== */
function rowCls(c){return (c.hide?'hid ':'')+(isAbn(c)&&c.status!=='Critical'?'abn ':'')+(c.status==='Critical'?'abn crit':'')}
function row(t,c,i){
 var id='r'+t.id+'_'+c.id, a='data-t="'+t.id+'" data-c="'+c.id+'"';
 if(c.type==='title')return '<tr class="r-title" id="'+id+'"><td></td><td class="c-h"><input type="checkbox" data-act="hidetitle" '+a+(c.hide?' checked':'')+' title="Hide whole section"></td><td colspan="5">'+esc(c.name)+'</td></tr>';
 var head='<td class="c-sl">'+i+'</td><td class="c-h"><input type="checkbox" data-act="hide" '+a+(c.hide?' checked':'')+' title="Hide from report"></td><td class="c-n">'+esc(c.name)+'</td>';
 if(c.type==='culture')
  return '<tr id="'+id+'" class="'+rowCls(c)+'">'+head+'<td colspan="2"><div class="cgp"><input class="f nav" '+a+' data-f="mic" placeholder="MIC" value="'+esc(c.mic)+'"><input class="f nav" '+a+' data-f="zone" placeholder="Zone mm" value="'+esc(c.zone)+'"><select class="f interp I_'+(c.interp||'NT')+'" '+a+' data-f="interp"><option value="">—</option>'+opt(['S','I','R','NT'],c.interp)+'</select></div></td><td class="c-ref"></td><td class="c-s"></td></tr>';
 if(c.type==='textarea')
  return '<tr id="'+id+'" class="'+rowCls(c)+'">'+head+'<td colspan="4"><textarea class="f nav" rows="2" '+a+' data-f="result">'+esc(c.result)+'</textarea></td></tr>';
 var isNum=c.type==='number';
 var ref=c.refs?'<select class="f refsel" '+a+' data-f="ref">'+opt(c.refs,c.ref)+'</select>':(c.ref?'<span class="ref">'+esc(c.ref)+'</span>':'');
 return '<tr id="'+id+'" class="'+rowCls(c)+'">'+head+
  '<td class="c-r"'+(isNum?'':' colspan="2"')+'><input class="f nav'+(badNum(c)?' bad':'')+'" '+a+' data-f="result" value="'+esc(c.result)+'" autocomplete="off" inputmode="'+(isNum?'decimal':'text')+'"></td>'+
  (isNum?'<td class="c-u"><input class="f" '+a+' data-f="unit" value="'+esc(c.unit)+'" placeholder="Unit"></td>':'')+
  '<td class="c-ref">'+ref+'</td>'+
  '<td class="c-s"><select class="f fl fl-'+(c.status||'none')+'" '+a+' data-f="status"><option value="">—</option>'+opt(STATUS,c.status)+'</select></td></tr>';
}
function signGrid(o){ /* o: {cls attr builder} */
 function s(key,label,ic,val){return '<div><label><i class="fas '+ic+'"></i>'+label+'</label><select '+o.attr(key)+'><option value="">Select…</option>'+opt(USERS,val)+'</select></div>'}
 return '<div class="so-grid">'+s('p','Prepared by','fa-user-edit',o.v.p)+s('r','Reviewed by','fa-search',o.v.r)+s('a','Authorized by','fa-stamp',o.v.a)+'</div>';
}
function sgSum(v){return [['fa-user-edit','Prepared',v.p],['fa-search','Reviewed',v.r],['fa-stamp','Authorized',v.a]].map(function(x){return '<span><i class="fas '+x[0]+'"></i><small>'+x[1]+'</small>'+(x[2]?esc(x[2]):'—')+'</span>'}).join('')}
function testCard(t){
 var p=null,rows='',k=0,s=stats(t);
 t.comps.forEach(function(c){if(c.type==='title')p=c.id;if(c.type!=='title')k++;rows+=row(t,c,k)});
 var dn='<label class="chk"><input type="checkbox" data-act="done" data-t="'+t.id+'"'+(t.done?' checked':'')+'> Completed</label>';
 var map={p:'sp',r:'sr',a:'sa'};
 var sign=S.sign==='test'
  ? '<div class="sec sg-row sgc"><div class="sg-main"><div class="sec-t"><i class="fas fa-signature"></i>Sign-off<small>auto-applied · change only if needed</small></div><div class="sg-sum" id="sgs'+t.id+'">'+sgSum({p:t.sp,r:t.sr,a:t.sa})+'<a data-act="sgedit">Change</a></div><div class="sg-edit">'+signGrid({v:{p:t.sp,r:t.sr,a:t.sa},attr:function(k){return 'data-t="'+t.id+'" data-tf="'+map[k]+'"'}})+'<div class="text-right mt-2"><a data-act="sgedit" class="lnk">Done</a></div></div></div>'+dn+'</div>'
  : '<div class="sec sg-row"><div class="so-lock" style="flex:1"><i class="fas fa-layer-group"></i>Signed category-wise under <b>'+esc(t.cat)+'</b><a data-act="gocat" data-cat="'+esc(t.cat)+'">Edit category sign-off ↓</a></div>'+dn+'</div>';
 return '<article class="tc'+(t.done?' done':'')+(S.mode==='bulk'&&S.collapsed[t.id]?' collapsed':'')+'" id="tc'+t.id+'" data-t="'+t.id+'">'+
  '<div class="th">'+
   '<label class="sel" title="Select for print" onclick="event.stopPropagation()"><input type="checkbox" data-act="sel" data-t="'+t.id+'"></label>'+
   '<div class="tt" data-act="toggle" data-t="'+t.id+'"><i class="fas fa-chevron-down tgl"></i><b>'+esc(t.name)+'</b><span class="mut">'+esc(t.short)+'</span></div><span class="sp"></span>'+
   '<span class="pill" data-r="fill">'+s.f+'/'+s.tot+' filled</span>'+
   '<span class="pill abn" data-r="abn" style="'+(s.a?'':'display:none')+'">'+s.a+' abnormal</span>'+
   '<span class="pill st '+(t.done?'ok':'wait')+'" data-r="st">'+(t.done?'<i class="fas fa-check"></i> Completed':'<i class="far fa-clock"></i> Pending')+'</span>'+
   '<button class="btn-x sm qd'+(t.done?' on':'')+'" data-act="qdone" data-t="'+t.id+'" title="Mark complete in one click"><i class="fas fa-check"></i> <span>'+(t.done?'Completed':'Complete')+'</span></button>'+
   '<button class="ib" data-act="print1" data-t="'+t.id+'" title="Preview / print this test"><i class="fas fa-print"></i></button>'+
  '</div>'+
  '<div class="tb">'+
   '<div class="tacts"><button data-act="hideempty" data-t="'+t.id+'"><i class="fas fa-eye-slash"></i> Hide empty rows from report</button><button data-act="showall" data-t="'+t.id+'"><i class="fas fa-eye"></i> Show all</button></div>'+
   '<div class="wrap"><table class="ct"><thead><tr><th class="c-sl">#</th><th class="c-h"><i class="fas fa-eye-slash"></i></th><th class="c-n">Component</th><th class="c-r">Result</th><th class="c-u">Unit</th><th class="c-ref">Reference</th><th class="c-s">Flag</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<div class="tfoot"><div class="sec"><div class="sec-t"><i class="fas fa-comment-medical"></i>Comment / Interpretation<small>printed before the signatures</small><span class="r"><span id="cc'+t.id+'">'+t.comment.length+'</span> chars</span></div>'+
    '<div class="phr">'+PHRASES.map(function(x,i){return '<button type="button" data-act="phr" data-t="'+t.id+'" data-i="'+i+'">+ '+esc(x)+'</button>'}).join('')+'</div>'+
    '<textarea class="f-c" data-t="'+t.id+'" data-tf="comment" placeholder="Add interpretation, clinical note or remarks…">'+esc(t.comment)+'</textarea></div>'+
   sign+'</div>'+
  '</div></article>';
}
function catSignPanel(c){
 var n=inCat(c).length, map=['p','r','a'];
 return '<div class="catsign" id="cs-'+esc(c).replace(/\s/g,'_')+'"><div class="sec-t"><i class="fas fa-users-cog"></i>Category sign-off — '+esc(c)+'<small>applies to all '+n+' test'+(n===1?'':'s')+' in this category</small></div>'+
  signGrid({v:SIGN[c],attr:function(k){return 'data-cat="'+esc(c)+'" data-cf="'+k+'"'}})+
  '<div class="acts"><button class="btn-x sm" data-act="copycats" data-cat="'+esc(c)+'"><i class="fas fa-copy"></i> Use for all categories</button>'+
  '<button class="btn-x sm ok" data-act="catdone" data-cat="'+esc(c)+'"><i class="fas fa-check-double"></i> Mark category complete</button></div></div>';
}
function visibleTests(){return S.mode==='single'?TESTS.filter(function(t){return t.id===S.cur}):TESTS.filter(function(t){return S.cat==='__all__'||t.cat===S.cat})}
function renderMain(){
 var list=visibleTests(),g={},h='';
 list.forEach(function(t){(g[t.cat]=g[t.cat]||[]).push(t)});
 Object.keys(g).forEach(function(c){
  h+='<section class="cat'+(S.cc[c]?' cc':'')+'" style="--cc:'+cc(c)+'" data-cat="'+esc(c)+'"><div class="cat-h"><span class="t"><label class="sel d-inline-flex mr-2" onclick="event.stopPropagation()"><input type="checkbox" data-act="selcat" data-cat="'+esc(c)+'" title="Select whole category"></label><span class="cn" data-act="togcat" data-cat="'+esc(c)+'"><i class="fas fa-folder-open"></i>'+esc(c)+'</span><small>'+g[c].length+' test'+(g[c].length===1?'':'s')+'</small></span><span><button class="btn-x sm" data-act="printcat" data-cat="'+esc(c)+'"><i class="fas fa-print"></i> Print category</button> <i class="fas fa-chevron-down text-muted ml-2" data-act="togcat" data-cat="'+esc(c)+'"></i></span></div>'+
   '<div class="cat-b">'+g[c].map(testCard).join('')+(S.sign==='cat'?catSignPanel(c):'')+'</div></section>';
 });
 $('#body').className=S.mode;
 $('#body').innerHTML=h||'<div class="sb-none">No tests</div>';
 syncSel();
}
function sbItem(t){
 var s=stats(t),pc=s.tot?Math.round(s.f/s.tot*100):0;
 return '<div class="sb-i'+(fOk(t)?'':' dim')+(S.mode==='single'&&S.cur===t.id?' on':'')+(t.done?' done':'')+(t.dirty?' dirty':'')+'" id="sb'+t.id+'" data-act="goto" data-t="'+t.id+'"><input type="checkbox" data-act="sel" data-t="'+t.id+'" title="Select for print"><div class="sb-n">'+esc(t.name)+'<small>'+esc(t.short)+'</small>'+(t.done?'<i class="fas fa-check-circle sb-ok"></i>':'<i class="far fa-clock sb-wt"></i>')+'</div><span class="sb-s">'+s.f+'/'+s.tot+'</span><div class="sb-p"><i style="width:'+pc+'%"></i></div></div>';
}
function fOk(t){return !((S.filter==='pending'&&t.done)||(S.filter==='done'&&!t.done))}
function matchF(t){
  if(S.q){var q=S.q.toLowerCase();if((t.name+' '+t.short+' '+t.cat).toLowerCase().indexOf(q)<0)return false}
 return true;
}
function renderSide(){
 var h='';
 cats().forEach(function(c){
  var all=inCat(c),ts=all.filter(matchF),d=all.filter(function(t){return t.done}).length; if(!ts.length){if(S.q)return;ts=all.slice()} /* fully filtered category still lists its tests */
  h+='<div class="sb-cat" style="--cc:'+cc(c)+'"><label><input type="checkbox" data-act="selcat" data-cat="'+esc(c)+'"><i class="fas fa-folder-open" style="color:var(--cc)"></i>'+esc(c)+'</label><span><a data-act="printcat" data-cat="'+esc(c)+'" title="Preview / print category" style="cursor:pointer;color:var(--pd);margin-right:8px"><i class="fas fa-print"></i></a>'+d+'/'+all.length+'</span></div>'+(all.length>ts.length&&!S.q?'<div class="sb-hid"><i class="fas fa-eye-slash"></i> '+(all.length-ts.length)+' hidden by filter · still counted for print</div>':'')+ts.map(sbItem).join('');
 });
 $('#sbl').innerHTML=h||'<div class="sb-none">No tests match</div>'; syncSel();
}
function renderSub(){
 var h='<div class="l">';
 if(S.mode==='single'){
  var i=TESTS.indexOf(T(S.cur));
  h+='<button class="btn-x sm" data-act="prev" title="Alt+←"><i class="fas fa-chevron-left"></i></button><span class="cur">'+(i+1)+' / '+TESTS.length+' · '+esc(T(S.cur).name)+'</span><button class="btn-x sm" data-act="next" title="Alt+→"><i class="fas fa-chevron-right"></i></button>'+
     '<button class="btn-x sm" data-act="nextpend"><i class="fas fa-forward"></i> Next pending</button>';
 }else{
  h+='<div class="chips"><span class="chip'+(S.cat==='__all__'?' on':'')+'" data-act="cat" data-cat="__all__">All<small>'+TESTS.length+'</small></span>';
  cats().forEach(function(c){var ts=inCat(c),d=ts.filter(function(t){return t.done}).length;h+='<span class="chip'+(S.cat===c?' on':'')+'" data-act="cat" data-cat="'+esc(c)+'">'+esc(c)+'<small>'+d+'/'+ts.length+'</small></span>'});
  h+='</div><button class="btn-x sm" data-act="colall">Collapse all</button><button class="btn-x sm" data-act="expall">Expand all</button>';
 }
 h+='<button class="btn-x sm" data-act="nextempty" title="F2"><i class="fas fa-keyboard"></i> Next empty</button></div>'+
    '<div class="prog"><div class="bar"><i id="pbar"></i></div><small id="ptxt">0%</small></div>';
 $('#sub').innerHTML=h; progress();
}
function progress(){var d=TESTS.filter(function(t){return t.done}).length,p=Math.round(d/TESTS.length*100);if($('#pbar')){$('#pbar').style.width=p+'%';$('#ptxt').textContent=d+'/'+TESTS.length+' done'}}
function renderChrome(){
 $$('#segMode button').forEach(function(b){b.classList.toggle('on',b.dataset.m===S.mode)});
 $$('#segSign button').forEach(function(b){b.classList.toggle('on',b.dataset.s===S.sign)});
 $('#saveScope').textContent=S.mode==='single'?'this test':'all tests';
 $('#btnAllDone').style.display=S.mode==='bulk'?'':'none';
 $('#optAuto').style.display=S.mode==='single'?'':'none';
 $('#pName').innerHTML=esc(PT.name)+' <span class="tag">'+esc(PT.age)+' · '+esc(PT.sex)+'</span>';
 $('#pId').textContent=PT.id;$('#pRef').textContent=PT.ref;
 $('#avatar').textContent=PT.name.split(' ').map(function(w){return w[0]}).slice(0,2).join('');
}
function renderAll(){renderChrome();renderSide();renderSub();renderMain();refreshDirty()}

/* ====================== incremental updates ====================== */
function updateRow(t,c){
 var tr=document.getElementById('r'+t.id+'_'+c.id);if(!tr)return;
 tr.className=rowCls(c)+(c.type==='title'?' r-title':'');
 var s=$('[data-f=status]',tr);if(s){s.value=c.status||'';s.className='f fl fl-'+(c.status||'none')}
 var r=$('[data-f=result]',tr);if(r&&c.type!=='textarea')r.classList.toggle('bad',badNum(c));
 var h=$('[data-act=hide]',tr);if(h)h.checked=!!c.hide;
}
function updateStats(t){
 var s=stats(t),card=$('#tc'+t.id);
 if(card){
  card.classList.toggle('done',t.done);
  $('[data-r=fill]',card).textContent=s.f+'/'+s.tot+' filled';
  var a=$('[data-r=abn]',card);a.style.display=s.a?'':'none';a.textContent=s.a+' abnormal';
  var st=$('[data-r=st]',card);st.className='pill st '+(t.done?'ok':'wait');st.innerHTML=t.done?'<i class="fas fa-check"></i> Completed':'<i class="far fa-clock"></i> Pending';
  var cb=$('[data-act=done]',card);if(cb)cb.checked=t.done;var qb=$('.qd',card);if(qb){qb.classList.toggle('on',t.done);$('span',qb).textContent=t.done?'Completed':'Complete'}
 }
 var sb=$('#sb'+t.id);
 if(sb){sb.classList.toggle('done',t.done);sb.classList.toggle('dirty',t.dirty);$('.sb-s',sb).textContent=s.f+'/'+s.tot;$('.sb-p i',sb).style.width=(s.tot?Math.round(s.f/s.tot*100):0)+'%'}
 progress();
}
function markDirty(t){t.dirty=true;var sb=$('#sb'+t.id);if(sb)sb.classList.add('dirty');refreshDirty()}
function refreshDirty(){var n=TESTS.filter(function(t){return t.dirty}).length;$('#dirty').classList.toggle('show',n>0);$('#dirtyN').textContent=n;$('#btnSave').classList.toggle('pri',true)}
function setDone(t,v){
 if(t.done===v)return; t.done=v; markDirty(t); updateStats(t);
}
function syncSel(){
 $$('input[data-act=sel]').forEach(function(i){i.checked=!!T(+i.dataset.t).sel});
 $$('input[data-act=selcat]').forEach(function(i){var ts=inCat(i.dataset.cat),n=ts.filter(function(t){return t.sel}).length;i.checked=n===ts.length;i.indeterminate=n>0&&n<ts.length});
 var n=TESTS.filter(function(t){return t.sel}).length;$('#selN').textContent=n;$('#selN').style.display=n?'':'none';
}
function setHide(t,c,v){c.hide=v;updateRow(t,c);updateStats(t);markDirty(t)}
function toast(m,k){var e=document.createElement('div');e.className='toast-x '+(k||'info');e.textContent=m;$('#toasts').appendChild(e);setTimeout(function(){e.style.opacity=0;e.style.transition='opacity .3s';setTimeout(function(){e.remove()},300)},2400)}

/* ========================= navigation ============================ */
function focusFirstEmpty(){if(isMobile())return;var e=$$('#body .nav').filter(function(x){return x.offsetParent&&!x.value})[0]||$('#body .nav');if(e)e.focus()}
function openTest(id){S.cur=id;renderSide();renderSub();renderMain();$('#main').scrollTop=0;setTimeout(focusFirstEmpty,30)}
function goTo(id){
 if(S.mode==='single'){openTest(id);return}
 if(S.cat!=='__all__'&&T(id).cat!==S.cat){S.cat='__all__';renderSub();renderMain()}
 S.collapsed[id]=false;var c=$('#tc'+id);if(c){c.classList.remove('collapsed');var cs=c.closest('.cat');cs.classList.remove('cc');S.cc[cs.dataset.cat]=false;c.scrollIntoView({behavior:'smooth',block:'start'})}
}
function step(d){var i=TESTS.indexOf(T(S.cur))+d;if(i<0||i>=TESTS.length)return;openTest(TESTS[i].id)}
function nextPending(){
 var i=TESTS.indexOf(T(S.cur)),n=TESTS.length;
 for(var k=1;k<=n;k++){var t=TESTS[(i+k)%n];if(!t.done&&t.id!==S.cur){if(S.mode==='single')openTest(t.id);else goTo(t.id);return}}
 toast('All tests are completed','ok');
}
function nextEmpty(){
 var all=$$('#body .nav').filter(function(x){return x.offsetParent}),cur=all.indexOf(document.activeElement),e=all.filter(function(x,i){return !x.value&&i>cur})[0]||all.filter(function(x){return !x.value})[0];
 if(e){e.focus();e.scrollIntoView({block:'center',behavior:'smooth'})}else toast('No empty result left','ok');
}
function setMode(m){S.mode=m;renderAll();if(m==='single')setTimeout(focusFirstEmpty,30)}
function setSign(m){
 if(m===S.sign)return;
 if(m==='cat'){ /* seed category sign from first signed test */
  cats().forEach(function(c){var s=SIGN[c];if(s.p||s.r||s.a)return;inCat(c).forEach(function(t){if(!s.p)s.p=t.sp;if(!s.r)s.r=t.sr;if(!s.a)s.a=t.sa})});
 }else{ /* back to per test: fill empty individual fields from category */
  TESTS.forEach(function(t){var s=SIGN[t.cat]||{};if(!t.sp&&s.p)t.sp=s.p;if(!t.sr&&s.r)t.sr=s.r;if(!t.sa&&s.a)t.sa=s.a});
 }
 S.sign=m;renderChrome();renderMain();
 toast(m==='cat'?'Category-wise sign-off: individual sign-off is hidden':'Per-test sign-off enabled','info');
}

/* ============================ events ============================= */
function onEdit(e){
