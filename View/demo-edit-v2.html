<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Report Edit — Unified</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
<style>
:root{--p:#7367f0;--pd:#5e50d9;--ps:#eeedfc;--ink:#1e293b;--mut:#64748b;--bd:#e2e8f0;--bg:#f8f8fb;--ok:#28c76f;--warn:#ff9f43;--bad:#ea5455}
body{background:var(--bg);color:#334155;font-size:.95rem}
.card{border:1px solid var(--bd);border-radius:10px;box-shadow:0 2px 8px rgba(30,41,59,.06)}
.hdr{border-top:4px solid var(--p);background:#fff;border-radius:10px 10px 0 0;padding:12px 16px}
.hdr .pt{font-weight:700;color:var(--ink);font-size:1.05rem}
.hdr .pt i{color:var(--p);margin-right:4px}.sep{color:#cbd5e1;margin:0 6px}
.seg{display:inline-flex;background:var(--ps);border-radius:22px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 16px;border-radius:20px;font-weight:700;font-size:.82rem;color:var(--pd)}
.seg button.on{background:var(--p);color:#fff;box-shadow:0 2px 6px rgba(115,103,240,.4)}
.toolbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--bd);padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{border:1.5px solid #cbd5e1;background:#fff;border-radius:20px;padding:3px 12px;font-size:.8rem;font-weight:600;cursor:pointer;color:#334155}
.chip:hover{border-color:var(--p)}
.chip.on{background:var(--p);border-color:var(--p);color:#fff}
.chip small{opacity:.8;margin-left:4px}.chip.done:not(.on){border-color:var(--ok);background:#f0fbf4}
.cat{margin:12px;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#fff}
.cat-h{background:linear-gradient(135deg,#f6f5fe,#eeedfc);padding:8px 14px;font-weight:800;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.single .cat-h{display:none}.single .cat{border:0;margin:0}
.tc{margin:10px;border:1px solid var(--bd);border-left:4px solid var(--warn);border-radius:8px;overflow:hidden}
.tc.completed{border-left-color:var(--ok)}.tc.invalid{border-left-color:var(--bad);box-shadow:inset 0 0 0 2px rgba(234,84,85,.15)}
.th{background:#f8fafc;padding:8px 12px;display:flex;align-items:center;gap:8px;cursor:pointer;border-bottom:1px solid var(--bd)}
.th b{color:var(--ink)}.th .ml{margin-left:auto}
.single .th{cursor:default}
table.ct{width:100%;table-layout:fixed;border-collapse:collapse;margin:0}
.ct th{background:#f1f5f9;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;padding:7px 8px;color:var(--ink);border-bottom:2px solid #cbd5e1}
.ct td{padding:4px 8px;border-bottom:1px solid var(--bd);vertical-align:middle;word-break:break-word}
.ct tbody tr:hover td{background:#f6f5fe}
.c-sl{width:4%;text-align:center}.c-h{width:5%;text-align:center}.c-n{width:22%;font-weight:700;color:var(--ink)}
.c-r{width:25%}.c-u{width:11%}.c-ref{width:19%}.c-s{width:14%}
.ct input.f,.ct select.f,.ct textarea.f{width:100%;padding:5px 9px;border:1.5px solid #cbd5e1;border-radius:6px;font-weight:600;color:var(--ink);font-size:.92rem}
.ct .f:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(115,103,240,.18);outline:0;background:#fffdf0}
.row-title td{background:#f1f5f9!important;font-weight:800;color:var(--ink)}
tr.hid td:not(.c-h):not(.c-sl){opacity:.4}tr.hid .c-n{text-decoration:line-through}
.ref{display:inline-block;padding:2px 9px;background:var(--ps);border-left:3px solid var(--p);border-radius:5px;font-size:.84rem;font-weight:600;color:var(--pd);cursor:pointer}
.interp{font-weight:800;text-align:center}
.interp.S{background:#d4edda;color:#0d6b3f}.interp.I{background:#fff3cd;color:#856404}.interp.R{background:#f8d7da;color:#842029}.interp.NT{background:#e9ecef;color:#6c757d}
.cg{display:flex;gap:6px}.cg .f{flex:1;min-width:0;text-align:center}
.so,.cat-f{padding:12px 14px;background:#fafbff;border-top:1px solid var(--bd)}
.cat-f{background:linear-gradient(135deg,#f6f5fe,#eeedfc);border-top:1px solid #d6d1fa}
.single .cat-f{display:none}
.so-t{font-size:.72rem;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--pd);margin-bottom:8px}
.so-t i{margin-right:5px}.so-t small{text-transform:none;letter-spacing:0;font-weight:600;color:var(--mut);margin-left:6px}
.so-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px}
.so .g label,.so-c label{font-size:.68rem;font-weight:800;text-transform:uppercase;color:var(--mut);margin:0 0 3px;display:block}
.so .g label i,.so-c label i{color:var(--p);margin-right:4px}
.so select,.cat-f select,.f-c{width:100%;padding:6px 10px;border:1.5px solid #cbd5e1;border-radius:7px;background:#fff;color:var(--ink);font-weight:600;font-size:.9rem}
.so select:focus,.cat-f select:focus,.f-c:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(115,103,240,.18);outline:0}
.f-c{resize:vertical;min-height:70px;font-weight:500;line-height:1.45}
.so-c{margin-top:12px}
.so-f{margin-top:10px;display:flex;justify-content:flex-end}
.chk{display:inline-flex;align-items:center;gap:6px;margin:0;font-size:.88rem;font-weight:700;color:var(--ink);text-transform:none;cursor:pointer;background:#fff;border:1.5px solid #cbd5e1;border-radius:20px;padding:4px 12px}
.chk input{accent-color:var(--p)}
.cat-act{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-top:10px}
.toast-x{position:fixed;right:20px;bottom:76px;z-index:9999;min-width:220px;padding:10px 16px;border-radius:8px;color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.2);animation:tin .25s}
.toast-x.ok{background:var(--ok)}.toast-x.err{background:var(--bad)}.toast-x.info{background:var(--p)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:768px){.so-grid{grid-template-columns:1fr}}
.vb{font-size:.72rem;font-weight:700;border-radius:12px;padding:2px 10px;background:#fee2e2;color:#991b1b;border:1px solid #fecaca}
.savebar{position:sticky;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--bd);padding:10px 16px;display:flex;align-items:center;gap:10px;border-radius:0 0 10px 10px}
.dirty{display:none;color:var(--warn);font-weight:700;font-size:.85rem}.dirty.show{display:inline}
.btn-primary{background:var(--p);border-color:var(--p)}.btn-primary:hover{background:var(--pd);border-color:var(--pd)}
.btn-warning{color:#fff}
.is-hidden{display:none!important}
@media(max-width:768px){.ct{min-width:560px}.c-ref{display:none}.show-ref .c-ref{display:table-cell}.wrap{overflow-x:auto}}
</style>
</head>
<body>
<div class="container-fluid py-2">
 <div class="card">
  <!-- HEADER -->
  <div class="hdr d-flex flex-wrap align-items-center justify-content-between">
   <div>
    <span class="pt"><i class="fas fa-user"></i>Rahim Uddin</span><span class="sep">·</span>
    <span class="pt"><i class="fas fa-birthday-cake"></i>34Y</span><span class="sep">·</span>
    <span class="pt"><i class="fas fa-venus-mars"></i>Male</span><span class="sep">·</span>
    <span class="pt"><i class="fas fa-barcode"></i>LR-240816-0042</span>
    <div class="text-muted small mt-1"><i class="fas fa-user-md"></i> Ref: Dr. A. Karim</div>
   </div>
   <div class="d-flex align-items-center mt-2 mt-md-0" style="gap:8px">
    <div class="seg" id="modeSeg">
     <button data-m="single" class="on"><i class="fas fa-file-alt"></i> Single</button>
     <button data-m="bulk"><i class="fas fa-layer-group"></i> Bulk</button>
    </div>
    <button class="btn btn-sm btn-outline-secondary" id="btnRef" title="Toggle reference"><i class="fas fa-columns"></i></button>
    <button class="btn btn-sm btn-outline-secondary" id="btnHideAll"><i class="fas fa-eye-slash"></i> Hide All</button>
   </div>
  </div>

  <!-- TOOLBAR: test chips (single = pick one, bulk = filter category) -->
  <div class="toolbar">
   <div class="chips" id="chips"></div>
   <div class="d-flex align-items-center" style="gap:8px;min-width:200px">
    <div class="progress flex-grow-1" style="height:6px"><div class="progress-bar bg-success" id="pbar"></div></div>
    <small class="font-weight-bold text-muted" id="ptxt">0%</small>
   </div>
  </div>

  <div id="body" class="single"></div>

  <!-- SAVE BAR -->
  <div class="savebar">
   <button class="btn btn-primary" id="btnSave"><i class="fas fa-save"></i> Save <span id="saveScope">Test</span></button>
   <button class="btn btn-outline-success" id="btnComplete"><i class="fas fa-check-double"></i> Mark all complete</button>
   <button class="btn btn-outline-secondary" onclick="location.reload()"><i class="fas fa-redo"></i> Reload</button>
   <span class="dirty" id="dirty"><i class="fas fa-circle"></i> Unsaved changes</span>
   <small class="ml-auto text-muted d-none d-md-inline">Ctrl+S to save · ↑ ↓ / Enter to move between results</small>
  </div>
 </div>
</div>

<datalist id="stl"><option>Normal<option>High<option>Low<option>Abnormal<option>Critical</datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/js/bootstrap.bundle.min.js"></script>
<script>
/* ===== DEMO DATA (replace with JSON from Laravel: @json($tests)) ===== */
var USERS=['Dr. Salma','Tech. Rafiq','Dr. Nasir'];
var TESTS=[
 {id:1,cat:'Hematology',name:'CBC',short:'CBC',done:false,comps:[
  {id:11,type:'title',name:'Red Cell Indices'},
  {id:12,type:'number',name:'Hemoglobin',result:'13.2',unit:'g/dL',ref:'13.0 – 17.0',refs:['13.0 – 17.0','12.0 – 15.5']},
  {id:13,type:'number',name:'RBC',result:'4.9',unit:'M/µL',ref:'4.5 – 5.9'},
  {id:14,type:'number',name:'WBC',result:'',unit:'K/µL',ref:'4.0 – 11.0'},
  {id:15,type:'textarea',name:'Remarks',result:''}]},
 {id:2,cat:'Hematology',name:'ESR',short:'ESR',done:true,comps:[
  {id:21,type:'number',name:'ESR (1st hr)',result:'12',unit:'mm/hr',ref:'0 – 15'}]},
 {id:3,cat:'Biochemistry',name:'Liver Function',short:'LFT',done:false,comps:[
  {id:31,type:'number',name:'Bilirubin Total',result:'0.8',unit:'mg/dL',ref:'0.2 – 1.2'},
  {id:32,type:'number',name:'SGPT (ALT)',result:'',unit:'U/L',ref:'< 41'},
  {id:33,type:'text',name:'Appearance',result:''}]},
 {id:4,cat:'Microbiology',name:'Urine C/S',short:'UCS',done:false,comps:[
  {id:41,type:'culture',name:'Ciprofloxacin',mic:'0.5',zone:'',result:'S'},
  {id:42,type:'culture',name:'Amoxicillin',mic:'',zone:'12',result:'R'}]}
];

var mode='single', cur=1, cat='__all__', dirty=false;
var $b=$('#body');

function opt(list,sel){return list.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+x+'</option>'}).join('')}
function refCell(c,n){
  if(c.refs) return '<div data-rp><input type="hidden" name="'+n+'[ref]" value="'+(c.ref||'')+'"><span class="ref" onclick="refOpen(this)">'+(c.ref||'—')+'</span><select class="f" style="display:none" onchange="refSet(this)"><option value="">—</option>'+opt(c.refs,c.ref)+'</select></div>';
  return c.ref?'<span class="ref" style="cursor:default">'+c.ref+'</span>':'';
}
/* ONE row renderer shared by single + bulk */
function row(c,i,t){
  var n='t'+t.id+'_c'+c.id;
  if(c.type==='title') return '<tr class="row-title" data-title="'+c.id+'"><td></td><td class="c-h"><input type="checkbox" class="hchk title" onchange="hideTitle(this)"></td><td colspan="5">'+c.name+'</td></tr>';
  var res;
  if(c.type==='culture'){
    res='<div class="cg"><input class="f" name="'+n+'[mic]" placeholder="MIC" value="'+(c.mic||'')+'"><input class="f" name="'+n+'[zone]" placeholder="Zone" value="'+(c.zone||'')+'"><select class="f interp '+(c.result||'NT')+'" style="flex:0 0 70px" name="'+n+'[result]" onchange="this.className=\'f interp \'+(this.value||\'NT\')"><option value="">—</option>'+opt(['S','I','R','NT'],c.result)+'</select></div>';
    return '<tr data-parent="'+(c._p||'')+'"><td class="c-sl">'+i+'</td><td class="c-h"><input type="checkbox" class="hchk" onchange="hideRow(this)"></td><td class="c-n">'+c.name+'</td><td colspan="2">'+res+'</td><td class="c-ref">'+refCell(c,n)+'</td><td class="c-s"></td></tr>';
  }
  if(c.type==='textarea') return '<tr data-parent="'+(c._p||'')+'"><td class="c-sl">'+i+'</td><td class="c-h"><input type="checkbox" class="hchk" onchange="hideRow(this)"></td><td class="c-n">'+c.name+'</td><td colspan="4"><textarea class="f nav" rows="2" name="'+n+'[result]">'+(c.result||'')+'</textarea></td></tr>';
  var unit=c.type==='number'?'<input class="f" name="'+n+'[unit]" value="'+(c.unit||'')+'" placeholder="Unit">':'';
  var span=c.type==='number'?'':' colspan="2"';
  return '<tr data-parent="'+(c._p||'')+'"><td class="c-sl">'+i+'</td><td class="c-h"><input type="checkbox" class="hchk" onchange="hideRow(this)"></td><td class="c-n">'+c.name+'</td><td class="c-r"'+span+'><input class="f nav" name="'+n+'[result]" value="'+(c.result||'')+'" autocomplete="off"></td>'+(unit?'<td class="c-u">'+unit+'</td>':'')+'<td class="c-ref">'+refCell(c,n)+'</td><td class="c-s"><input class="f text-center" list="stl" name="'+n+'[status]" placeholder="—"></td></tr>';
}
function sel(c,l,ic){return '<div class="g"><label><i class="fas '+ic+'"></i>'+l+'</label><select class="'+c+'"><option value="">Select</option>'+opt(USERS)+'</select></div>'}
function catFooter(c){return '<div class="cat-f"><div class="so-t"><i class="fas fa-users-cog"></i>Category sign-off<small>applies to every test in '+c+'</small></div><div class="so-grid">'+sel('cp','Prepared by','fa-user-edit')+sel('cr','Reviewed by','fa-search')+sel('ca','Authorized by','fa-stamp')+'</div><div class="cat-act"><label class="chk"><input type="checkbox" class="onlyEmpty" checked> Only fill empty</label><button type="button" class="btn btn-sm btn-outline-secondary" onclick="resetSign(this)"><i class="fas fa-undo"></i> Reset</button><button type="button" class="btn btn-sm btn-primary" onclick="applySign(this)"><i class="fas fa-check"></i> Apply to all in category</button></div></div>'}
function testCard(t){
  var p=null,rows='',k=0;
  t.comps.forEach(function(c){ if(c.type==='title')p=c.id; c._p=(c.type==='title')?'':p; if(c.type!=='title')k++; rows+=row(c,k,t); });
  return '<div class="tc '+(t.done?'completed':'')+'" data-id="'+t.id+'">'+
   '<div class="th" onclick="if(mode===\'bulk\')$(this).next().slideToggle(150)"><b>'+t.name+'</b><span class="text-muted">('+t.short+')</span>'+
   '<span class="badge badge-'+(t.done?'success':'warning')+' st">'+(t.done?'✓ Completed':'⏳ Pending')+'</span><span class="vb" style="display:none"></span>'+
   '<span class="ml"><button type="button" class="btn btn-sm btn-outline-primary" onclick="event.stopPropagation();alert(\'Print test '+t.id+'\')"><i class="fas fa-print"></i></button></span></div>'+
   '<div class="td"><div class="wrap"><table class="ct"><thead><tr><th class="c-sl">SL</th><th class="c-h"><i class="fas fa-eye-slash"></i></th><th class="c-n">Component</th><th class="c-r">Result</th><th class="c-u">Unit</th><th class="c-ref">Reference</th><th class="c-s">Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   '<div class="so"><div class="so-t"><i class="fas fa-signature"></i>Sign-off</div><div class="so-grid">'+sel('sp','Prepared by','fa-user-edit')+sel('sr','Reviewed by','fa-search')+sel('sa','Authorized by','fa-stamp')+'</div>'+
   '<div class="so-c"><label><i class="fas fa-comment-alt"></i>Comment</label><textarea class="f-c" rows="3" placeholder="Add interpretation, clinical note or remarks…">'+(t.comment||'')+'</textarea></div>'+
   '<div class="so-f"><label class="chk"><input type="checkbox" class="cmp" '+(t.done?'checked':'')+'> Report is completed</label></div></div></div></div>';
}

/* ===== RENDER: same cards, different scope ===== */
function render(){
  var list = mode==='single' ? TESTS.filter(function(t){return t.id===cur}) : TESTS;
  var groups={}; list.forEach(function(t){(groups[t.cat]=groups[t.cat]||[]).push(t)});
  var h=''; Object.keys(groups).forEach(function(c){
    h+='<div class="cat" data-cat="'+c+'"><div class="cat-h" onclick="$(this).next().slideToggle(150)"><span><i class="fas fa-folder text-primary"></i> '+c+' <span class="badge badge-primary">'+groups[c].length+'</span></span><i class="fas fa-chevron-up"></i></div><div>'+groups[c].map(testCard).join('')+catFooter(c)+'</div></div>';
  });
  $b.attr('class',mode).html(h);
  chips(); $('#saveScope').text(mode==='single'?'Test':'All');
  $('#btnComplete').toggle(mode==='bulk'); progress(); applyCat();
}
function chips(){
  var h='';
  if(mode==='single'){
    TESTS.forEach(function(t){h+='<span class="chip '+(t.id===cur?'on':'')+(t.done?' done':'')+'" data-id="'+t.id+'">'+t.name+'</span>'});
  }else{
    h='<span class="chip '+(cat==='__all__'?'on':'')+'" data-cat="__all__">All<small>'+TESTS.length+'</small></span>';
    var cs=[...new Set(TESTS.map(function(t){return t.cat}))];
    cs.forEach(function(c){var ts=TESTS.filter(function(t){return t.cat===c}),d=ts.filter(function(t){return t.done}).length;
      h+='<span class="chip '+(cat===c?'on':'')+(d===ts.length?' done':'')+'" data-cat="'+c+'">'+c+'<small>'+d+'/'+ts.length+'</small></span>'});
  }
  $('#chips').html(h);
}
function applyCat(){ if(mode!=='bulk')return; $('.cat').each(function(){$(this).toggleClass('is-hidden',cat!=='__all__'&&$(this).data('cat')!==cat)}) }
function progress(){var all=$('.tc').length,d=$('.tc.completed').length,p=all?Math.round(d/all*100):0;$('#pbar').css('width',p+'%');$('#ptxt').text(p+'% complete')}

/* ===== EVENTS ===== */
$('#modeSeg').on('click','button',function(){ if(dirty&&!confirm('Discard unsaved changes?'))return; mode=$(this).data('m'); $('#modeSeg button').removeClass('on');$(this).addClass('on'); setDirty(false); render(); });
$('#chips').on('click','.chip',function(){
  if(mode==='single'){ if(dirty&&!confirm('Discard unsaved changes?'))return; cur=+$(this).data('id'); setDirty(false); render(); }
  else{ cat=$(this).data('cat'); chips(); applyCat(); }
});
$('#btnRef').on('click',function(){$('body').toggleClass('show-ref')});
$('#btnHideAll').on('click',function(){var on=!$(this).hasClass('active');$(this).toggleClass('active',on);$('.hchk').prop('checked',on).each(function(){$(this).closest('tr').toggleClass('hid',on)});setDirty(true)});
$b.on('input change','input,select,textarea',function(){setDirty(true)});
$b.on('change','.cmp',function(){var c=$(this).closest('.tc'),on=this.checked;c.toggleClass('completed',on).find('.st').toggleClass('badge-success',on).toggleClass('badge-warning',!on).text(on?'✓ Completed':'⏳ Pending');progress()});
$('#btnComplete').on('click',function(){$('.cmp').not(':checked').prop('checked',true).trigger('change')});

function hideRow(el){$(el).closest('tr').toggleClass('hid',el.checked)}
function hideTitle(el){var id=$(el).closest('tr').data('title');$(el).closest('tbody').find('tr[data-parent="'+id+'"]').each(function(){$(this).toggleClass('hid',el.checked).find('.hchk').prop('checked',el.checked)})}
function refOpen(s){var w=$(s).closest('[data-rp]');$(s).hide();w.find('select').show().focus()}
function refSet(s){var w=$(s).closest('[data-rp]');w.find('input[type=hidden]').val(s.value);w.find('.ref').text(s.value||'—').show();$(s).hide()}
$b.on('blur','[data-rp] select',function(){var w=$(this).closest('[data-rp]');setTimeout(function(){w.find('select').hide();w.find('.ref').show()},150)});

/* Excel-like navigation */
$b.on('keydown','.nav',function(e){
  if(e.shiftKey||e.ctrlKey||e.altKey||e.metaKey)return;
  var d=e.key==='ArrowUp'?-1:(e.key==='ArrowDown'||(e.key==='Enter'&&!$(this).is('textarea')))?1:0; if(!d)return;
  var all=$('.nav:visible'),i=all.index(this)+d; if(i<0||i>=all.length)return; e.preventDefault(); all.eq(i).focus().select();
});

/* Category sign-off */
function applySign(b){
  var f=$(b).closest('.cat-f'),only=f.find('.onlyEmpty').is(':checked'),n=0,
      m={sp:f.find('.cp').val(),sr:f.find('.cr').val(),sa:f.find('.ca').val()};
  if(!m.sp&&!m.sr&&!m.sa){toast('Select at least one person','err');return}
  f.closest('.cat').find('.tc').each(function(){var c=$(this);
    $.each(m,function(k,v){if(!v)return;var s=c.find('.'+k);if(only&&s.val())return;s.val(v);n++})});
  toast('Sign-off applied ('+n+' field'+(n===1?'':'s')+')','ok');setDirty(true);
}
function resetSign(b){$(b).closest('.cat-f').find('select').val('')}
function toast(m,t){var e=$('<div class="toast-x '+(t||'info')+'">'+m+'</div>').appendTo('body');setTimeout(function(){e.fadeOut(300,function(){e.remove()})},2200)}

/* Dirty + save */
function setDirty(v){dirty=v;$('#dirty').toggleClass('show',v);$('#btnSave').toggleClass('btn-warning',v).toggleClass('btn-primary',!v)}
$(window).on('beforeunload',function(){if(dirty)return 'Unsaved changes'});
$(document).on('keydown',function(e){if(e.ctrlKey&&e.key==='s'){e.preventDefault();save()}});
$('#btnSave').on('click',save);
function save(){
  var bad=$('.tc.invalid'); if(bad.length){toast('Fix validation errors first','err');return}
  var scope=$('.tc'); var payload=scope.map(function(){var c=$(this);return {id:c.data('id'),complete:c.find('.cmp').is(':checked')?1:0,prepared_by:c.find('.sp').val(),reviewed_by:c.find('.sr').val(),authorized_by:c.find('.sa').val(),comment:c.find('.f-c').val(),components:c.find('.ct :input').serializeArray()}}).get();
  console.log('POST payload (single = 1 test, bulk = many):',payload);
  /* $.ajax({url:form_action,type:'POST',contentType:'application/json',data:JSON.stringify({tests:payload}),headers:{'X-CSRF-TOKEN':...}}) */
  setDirty(false); toast('Saved '+payload.length+' test(s)','ok');
}
render();
</script>
</body>
</html>
